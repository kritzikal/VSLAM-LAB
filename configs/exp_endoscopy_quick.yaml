# Quick Endoscopy SLAM Benchmark (single run, GT datasets)
#
# Uses C3VD and EndoSLAM which have ground truth for ATE evaluation.
# Run with:
#   pixi run -e vslamlab vslamlab configs/exp_endoscopy_quick.yaml

exp_mast3rslam_quick:
  Config: config_endoscopy_gt.yaml
  NumRuns: 1
  Parameters: {verbose: 0, mode: 'mono', rgb_idx: [0, 200]}
  Module: mast3rslam

exp_sageslam_quick:
  Config: config_endoscopy_gt.yaml
  NumRuns: 1
  Parameters: {verbose: 1, mode: 'mono', enable_gui: 'false', rgb_idx: [0, 200]}
  Module: sageslam-dev

exp_oneslam_quick:
  Config: config_endoscopy_gt.yaml
  NumRuns: 1
  Parameters: {verbose: 1, mode: 'mono', rgb_idx: [0, 200]}
  Module: oneslam-dev
